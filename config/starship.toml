# ====================================
# STARSHIP CONFIGURATION
# ====================================

# Global settings
format = """
$username@$hostname:$directory ❯ """

# Disable the blank line at the start of the prompt
add_newline = false

right_format = "$custom"

# Username module
[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
disabled = false
show_always = true

# Hostname module
[hostname]
ssh_only = false
format = "[🦆]($style)"
style = "bold blue"
disabled = false

# Directory module
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style)"

# Disable git modules (as requested)
[git_branch]
disabled = true

[git_commit]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[git_status]
disabled = true

# Disable other modules you probably don't need
[aws]
disabled = true

[azure]
disabled = true

[conda]
disabled = true

[custom.conda_name]
when = '[[ -n "$CONDA_PREFIX" ]]'
command = 'basename $(dirname "$CONDA_PREFIX")'
format = '[$symbol\($output\)]($style)'
symbol = '🐲'
style = 'bold yellow'
# Deshabilita el prefijo propio de conda (muy importante)
# conda config --set changeps1 false

[docker_context]
disabled = true

[dotnet]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[julia]
disabled = true

[kubernetes]
disabled = true

[nodejs]
disabled = true

[package]
disabled = true

[perl]
disabled = true

[php]
disabled = true

[python]
disabled = true

[custom.python_name]
# Sólo mostrar si VIRTUAL_ENV existe
when = '[[ -n "$VIRTUAL_ENV" ]]'
# Extraer el nombre del directorio padre del virtualenv
command = 'basename $(dirname "$VIRTUAL_ENV")'
format = '${symbol}\($output\)'
style = 'yellow bold'
symbol = '🐍'

[ruby]
disabled = true

[rust]
disabled = true

[swift]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[zig]
disabled = true
